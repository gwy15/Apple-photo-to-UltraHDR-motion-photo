[package]
name = "aa-photo-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aa-photo-bridge"
path = "src/bin/aa-photo-bridge.rs"

[profile.release]
lto = true
strip = true

[dependencies]
anyhow = "1.0.95"
tracing = "0.1.41"
tempfile = "3.15.0"
libheif-rs = "1.1.0"
libultrahdr-rs = "0.1.0"
turbojpeg = { version = "1.2.1", default-features = false }
turbojpeg-sys = { version = "1", default-features = false }
rayon = "1.10.0"
clap = { version = "4.5.26", features = ["derive"] }
indicatif = "0.17.9"
tracing-indicatif = "0.3.9"
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }

[dependencies.rsmpeg]
version = "0.15.1"
default-features = false
features = ["ffmpeg7"]

[dev-dependencies]

